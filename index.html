<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Papan Jurnal Trading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F6FA; --surface:#FFFFFF; --surface2:#EEF3F8; --border:#DBE4EE;
    --text:#1E293B; --muted:#64748B;
    --gain:#16A570; --gain-soft:rgba(22,165,112,0.10);
    --loss:#D8475A; --loss-soft:rgba(216,71,90,0.10);
    --gold:#B8892F; --gold-soft:rgba(184,137,47,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow-y:scroll !important;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#A9BDD6 var(--surface2);-ms-overflow-style:scrollbar;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  .serif{font-family:'Lora',serif;}
  input,select,textarea,button{font-family:inherit;}
  input,select,textarea{
    background:var(--surface2); border:1px solid var(--border); color:var(--text);
    border-radius:8px; padding:9px 11px; width:100%; font-size:13.5px;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);}
  button{cursor:pointer; border:none; font-family:inherit;}
  ::-webkit-scrollbar{height:5px;width:6px;}
  ::-webkit-scrollbar-track{background:var(--surface2);}
  ::-webkit-scrollbar-thumb{background:#A9BDD6;border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:#87A0C2;}
  #riwayatTableWrap::-webkit-scrollbar{height:7px;}
  #riwayatTableWrap::-webkit-scrollbar-track{background:var(--surface2);border-radius:4px;}
  #riwayatTableWrap::-webkit-scrollbar-thumb{background:#A9BDD6;border-radius:4px;}
  #stickyHScrollBar::-webkit-scrollbar{height:8px;}
  #stickyHScrollBar::-webkit-scrollbar-track{background:var(--surface2);}
  #stickyHScrollBar::-webkit-scrollbar-thumb{background:#A9BDD6;border-radius:4px;}
  @keyframes ticker{0%{transform:translateX(0);}100%{transform:translateX(-50%);}}
  @keyframes spin{to{transform:rotate(360deg);}}
  .spinning{display:inline-block;animation:spin 0.7s linear infinite;}
  .ticker-track{animation:ticker 30s linear infinite; width:max-content; display:flex;}
  .card{background:var(--surface); border:1px solid var(--border); border-radius:12px;}
  .btn-gold{background:var(--gold); color:#181103; font-weight:600; border-radius:8px; transition:background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease; cursor:pointer;}
  .btn-gold:hover{background:#C79B44; box-shadow:0 3px 10px rgba(184,137,47,0.3); transform:translateY(-1px);}
  .btn-gold:active{transform:translateY(0); box-shadow:none;}
  .btn-outline{border:1px solid var(--border); color:var(--muted); border-radius:8px; background:transparent; transition:background 0.15s ease, border-color 0.15s ease, color 0.15s ease, transform 0.1s ease; cursor:pointer;}
  .btn-outline:hover{background:var(--gold-soft); border-color:var(--gold); color:#8A6A24; transform:translateY(-1px);}
  .btn-outline:active{transform:translateY(0);}
  .grid-summary{display:grid; gap:12px; grid-template-columns:repeat(4, 1fr);}
  @media (max-width:900px){ .grid-summary{grid-template-columns:repeat(2, 1fr);} }
  .grid-charts{display:grid; gap:16px; grid-template-columns:1.3fr 1fr;}
  @media (max-width:800px){ .grid-charts{grid-template-columns:1fr;} }
  .chart-box{width:100%; overflow-x:auto;}
  .chart-box svg{display:block;}
  .grid-filters{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));}
  .grid-form{display:grid; gap:12px; grid-template-columns:1fr 1fr;}
  table{width:100%; border-collapse:collapse; min-width:1200px;}
  th{padding:10px 12px; text-align:left; white-space:nowrap; background:#3E4C63; color:#EAF0F7; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.4px;}
  td{padding:10px 12px; font-size:12.5px; border-top:1px solid var(--border);}
  .badge{font-size:10.5px; padding:2px 8px; border-radius:999px; border:1px solid var(--border);}
  .icon-btn{background:none;border:none;color:var(--muted);padding:4px;display:inline-flex;align-items:center;border-radius:6px;cursor:pointer;transition:background 0.15s ease, color 0.15s ease;}
  .icon-btn:hover{background:var(--gold-soft); color:var(--gold);}
  .modal-overlay{position:fixed; inset:0; background:rgba(5,8,15,0.7); z-index:50; display:flex; align-items:center; justify-content:center; padding:16px;}
  .modal-box{background:var(--surface); border:1px solid var(--border); border-radius:14px; width:100%; padding:24px;}
  .hidden{display:none !important;}
  .field label{color:var(--muted); font-size:12px; display:block; margin-bottom:6px;}
  .field{display:flex; flex-direction:column; gap:2px;}
  .full{grid-column:1 / -1;}
  a{color:inherit;}
  .save-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);}
  .save-dot{width:7px;height:7px;border-radius:50%;background:var(--gain);}
  .legend-dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px;}
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================== CONFIG ============================== */
const LOT_SIZE = 100;
const STORAGE_KEY = "trades_journal_default";
const C_GAIN = "#16A570", C_LOSS = "#D8475A", C_GOLD = "#B8892F", C_MUTED = "#64748B", C_BORDER = "#DBE4EE", C_SURFACE2 = "#EEF3F8";

/* ============================== HELPERS ============================== */
const fmtIDR = (n) => {
  if (n===null||n===undefined||isNaN(n)) return "-";
  const sign = n<0 ? "-" : "";
  return sign + "Rp " + Math.abs(Math.round(n)).toLocaleString("id-ID");
};
const fmtShort = (n) => {
  if (n===null||n===undefined||isNaN(n)) return "0";
  const sign = n<0 ? "-" : "";
  const abs = Math.abs(n);
  if(abs>=1000000000) return sign+(abs/1000000000).toFixed(1)+"M";
  if(abs>=1000000) return sign+(abs/1000000).toFixed(1)+"jt";
  if(abs>=1000) return sign+(abs/1000).toFixed(0)+"rb";
  return sign+abs.toFixed(0);
};
const fmtNum = (n,d=0) => (n===null||n===undefined||isNaN(n)) ? "-" : Number(n).toLocaleString("id-ID",{maximumFractionDigits:d});
const fmtPct = (n) => (n===null||n===undefined||isNaN(n)) ? "-" : (n>=0?"+":"") + n.toFixed(2) + "%";
const fmtPoint = (n) => (n===null||n===undefined||isNaN(n)) ? "-" : (n>=0?"+":"-") + Math.abs(n).toLocaleString("id-ID",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate = (s) => { if(!s) return "-"; const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}); };
const fmtDateShort = (s) => { if(!s) return "-"; const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"}); };
const fmtDateDMY = (s) => { if(!s) return "-"; const [y,m,d] = s.split("-"); return `${d}-${m}-${y}`; };
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const esc = (s) => (s===undefined||s===null) ? "" : String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ============================== HARGA OTOMATIS (Yahoo Finance via proxy publik) ============================== */
const CORS_PROXIES = [
  (u)=> "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  (u)=> "https://corsproxy.io/?url=" + encodeURIComponent(u),
  (u)=> "https://api.codetabs.com/v1/proxy?quest=" + encodeURIComponent(u),
];

async function fetchViaProxies(targetUrl){
  let lastErr = null;
  for(const buildProxyUrl of CORS_PROXIES){
    try{
      const res = await fetch(buildProxyUrl(targetUrl), {cache:"no-store"});
      if(!res.ok) throw new Error("HTTP " + res.status);
      return await res.json();
    }catch(e){
      lastErr = e;
      continue; // coba proxy berikutnya
    }
  }
  throw lastErr || new Error("Semua proxy gagal merespons");
}

async function fetchYahooQuote(symbol){
  let price=null, prevClose=null, source=null, asOfEpoch=null;
  const cacheBust = "&_cb=" + Date.now(); // anti-cache: bikin URL unik tiap panggilan agar proxy tidak menyajikan cache lama

  // 1) Endpoint quote resmi Yahoo — sumber harga & harga penutupan kemarin paling realtime.
  try{
    const quoteUrl = "https://query2.finance.yahoo.com/v7/finance/quote?symbols=" + encodeURIComponent(symbol) + cacheBust;
    const data = await fetchViaProxies(quoteUrl);
    const r = data && data.quoteResponse && data.quoteResponse.result && data.quoteResponse.result[0];
    if(r && r.regularMarketPrice!==undefined && r.regularMarketPrice!==null){
      price = r.regularMarketPrice;
      prevClose = (r.regularMarketPreviousClose!==undefined && r.regularMarketPreviousClose!==null) ? r.regularMarketPreviousClose : null;
      asOfEpoch = (r.regularMarketTime!==undefined && r.regularMarketTime!==null) ? r.regularMarketTime : null;
      source = "quote";
    }
  }catch(e){
    /* endpoint quote gagal/diblokir — lanjut coba endpoint chart di bawah sebagai cadangan */
  }

  // 2) Cadangan: endpoint chart historis, kalau endpoint quote gagal atau tidak lengkap.
  if(price===null || prevClose===null){
    try{
      const chartUrl = "https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(symbol) + "?range=5d&interval=1d" + cacheBust;
      const data = await fetchViaProxies(chartUrl);
      const meta = data && data.chart && data.chart.result && data.chart.result[0] && data.chart.result[0].meta;
      if(price===null) price = meta && meta.regularMarketPrice!==undefined ? meta.regularMarketPrice : null;
      if(prevClose===null) prevClose = meta && (meta.previousClose!==undefined ? meta.previousClose : (meta.chartPreviousClose!==undefined ? meta.chartPreviousClose : null));
      if(asOfEpoch===null) asOfEpoch = meta && meta.regularMarketTime!==undefined ? meta.regularMarketTime : null;
      if(source===null) source = "chart";
    }catch(e){
      if(price===null){
        if(/Failed to fetch|NetworkError|blocked/i.test(String(e.message||e))){
          throw new Error("Koneksi ke internet diblokir di lingkungan ini (mis. pratinjau chat), atau semua proxy publik sedang tidak merespons. Coba lagi setelah file diunduh & dibuka langsung di browser, atau isi manual.");
        }
        throw new Error("Semua sumber data harga gagal merespons untuk " + symbol + ". Isi manual sebagai cadangan.");
      }
    }
  }

  if(price===null) throw new Error("Data harga kosong untuk " + symbol);

  // Poin & persentase SELALU dihitung manual dari price vs prevClose yang sama-sama ditampilkan,
  // supaya angkanya konsisten dan bisa langsung dicocokkan manual oleh pengguna.
  const changePoint = (prevClose!==null) ? (price - prevClose) : null;
  const changePercent = (prevClose!==null && prevClose!==0) ? (changePoint/prevClose)*100 : null;
  const asOfText = asOfEpoch ? new Date(asOfEpoch*1000).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit",timeZone:"Asia/Jakarta"}) + " WIB" : null;

  return {price, changePercent, changePoint, prevClose, source, asOfText};
}

async function fetchYahooPrice(kodeSaham){
  const symbol = kodeSaham.toUpperCase().trim() + ".JK";
  const q = await fetchYahooQuote(symbol);
  return {price: q.price, prevClose: q.prevClose};
}

function showToast(msg){
  let toast = document.getElementById("appToast");
  if(!toast){
    toast = document.createElement("div");
    toast.id = "appToast";
    toast.style.cssText = "position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1E293B;border:1px solid #334155;color:#F1F5F9;padding:10px 16px;border-radius:8px;font-size:12.5px;z-index:200;box-shadow:0 4px 16px rgba(30,41,59,0.25);max-width:90vw;text-align:center;transition:opacity 0.3s;font-family:'Inter',sans-serif;";
    document.body.appendChild(toast);
  }
  toast.textContent = msg;
  toast.style.opacity = "1";
  clearTimeout(toast._hideTimer);
  toast._hideTimer = setTimeout(()=>{ toast.style.opacity = "0"; }, 4000);
}

function computeTrade(t){
  const lotBeli = Number(t.lotBeli)||0;
  const lotJual = (t.lotJual!==""&&t.lotJual!==null&&t.lotJual!==undefined) ? Number(t.lotJual) : lotBeli;
  const hargaBeli = Number(t.hargaBeli)||0;
  const hargaJual = (t.hargaJual!==""&&t.hargaJual!==null&&t.hargaJual!==undefined) ? Number(t.hargaJual) : null;
  const feeBeliPct = Number(t.feeBeliPct)||0;
  const feeJualPct = Number(t.feeJualPct)||0;
  const hargaSekarang = Number(t.hargaSekarang) || hargaBeli;

  const totalHargaBeliBruto = hargaBeli * lotBeli * LOT_SIZE;
  const totalHargaBeli = totalHargaBeliBruto * (1 + feeBeliPct/100); // net (sudah termasuk fee beli)
  const isClosed = !!(t.tanggalJual && hargaJual!==null);

  let totalHargaJualBruto=null, totalHargaJual=null, realizedPL=null, potentialPL=null, realizedPLBruto=null, potentialPLBruto=null;
  if(isClosed){
    totalHargaJualBruto = hargaJual * lotJual * LOT_SIZE;
    totalHargaJual = totalHargaJualBruto * (1 - feeJualPct/100); // net (sudah dipotong fee jual)
    realizedPL = totalHargaJual - totalHargaBeli; // net (sudah kena fee beli & jual)
    realizedPLBruto = totalHargaJualBruto - totalHargaBeliBruto; // bruto (tanpa fee sama sekali)
  } else {
    potentialPL = (hargaSekarang * lotBeli * LOT_SIZE) - totalHargaBeli; // net (kena fee beli)
    potentialPLBruto = (hargaSekarang * lotBeli * LOT_SIZE) - totalHargaBeliBruto; // bruto (tanpa fee)
  }
  const plUtama = isClosed ? realizedPL : potentialPL; // net
  const plUtamaBruto = isClosed ? realizedPLBruto : potentialPLBruto; // bruto
  const plPct = totalHargaBeli>0 ? (plUtama/totalHargaBeli)*100 : 0;
  const plPctBruto = totalHargaBeliBruto>0 ? (plUtamaBruto/totalHargaBeliBruto)*100 : 0;

  const prevCloseHarian = (t.prevCloseHarian!==undefined && t.prevCloseHarian!==null && t.prevCloseHarian!=="") ? Number(t.prevCloseHarian) : null;
  const dailyChangePercent = (!isClosed && prevCloseHarian && prevCloseHarian!==0)
    ? ((hargaSekarang - prevCloseHarian)/prevCloseHarian)*100
    : null;

  return {...t, lotBeli, lotJual, hargaBeli, hargaJual, feeBeliPct, feeJualPct, hargaSekarang, prevCloseHarian,
    totalHargaBeliBruto, totalHargaBeli, totalHargaJualBruto, totalHargaJual, realizedPL, potentialPL,
    plUtama, plUtamaBruto, plPct, plPctBruto, dailyChangePercent, isClosed,
    status: isClosed ? "Closed" : "Open"};
}

const SAMPLE_TRADES = [
  {id:uid(), kodeSaham:"BBCA", tanggalBeli:"2026-06-02", tanggalJual:"2026-07-14", lotBeli:10, lotJual:10, hargaBeli:9800, hargaJual:10450, feeBeliPct:0.15, feeJualPct:0.25, modal:9814700, hargaSekarang:"", alasanBeli:"Breakout dari konsolidasi 3 bulan, volume di atas rata-rata.", alasanJual:"Target take profit 6% tercapai."},
  {id:uid(), kodeSaham:"BMRI", tanggalBeli:"2026-07-01", tanggalJual:"", lotBeli:20, lotJual:"", hargaBeli:6200, hargaJual:"", feeBeliPct:0.15, feeJualPct:0.25, modal:12418600, hargaSekarang:6450, alasanBeli:"Valuasi murah menjelang laporan keuangan Q2.", alasanJual:""},
  {id:uid(), kodeSaham:"GOTO", tanggalBeli:"2026-05-10", tanggalJual:"2026-05-28", lotBeli:500, lotJual:500, hargaBeli:68, hargaJual:59, feeBeliPct:0.15, feeJualPct:0.25, modal:3405100, hargaSekarang:"", alasanBeli:"Rebound teknikal dari support jangka panjang.", alasanJual:"Stop loss tersentuh, momentum melemah."},
  {id:uid(), kodeSaham:"ANTM", tanggalBeli:"2026-07-20", tanggalJual:"", lotBeli:15, lotJual:"", hargaBeli:1710, hargaJual:"", feeBeliPct:0.15, feeJualPct:0.25, modal:2564600, hargaSekarang:1655, alasanBeli:"Sentimen kenaikan harga emas dunia.", alasanJual:""},
  {id:uid(), kodeSaham:"TLKM", tanggalBeli:"2026-04-15", tanggalJual:"2026-06-03", lotBeli:25, lotJual:25, hargaBeli:3120, hargaJual:3410, feeBeliPct:0.15, feeJualPct:0.25, modal:7811700, hargaSekarang:"", alasanBeli:"Dividen yield menarik, sektor telko stabil.", alasanJual:"Rotasi sektor, ambil untung sebelum cum date lewat."}
];
const EMPTY_TRADE = {id:"",kodeSaham:"",tanggalBeli:"",tanggalJual:"",lotBeli:"",lotJual:"",hargaBeli:"",hargaJual:"",feeBeliPct:"0.15",feeJualPct:"0.25",modal:"",hargaSekarang:"",alasanBeli:"",alasanJual:""};

/* ============================== STATE ============================== */
let state = {
  booted:false, trades:[],
  filters:{saham:"Semua",status:"Semua",beliFrom:"",beliTo:"",jualFrom:"",jualTo:""},
  showForm:false, editingId:null, form:{...EMPTY_TRADE},
  showFilters:true, confirmDelete:null, saveState:"idle",
  ihsg:{price:null, changePercent:null, changePoint:null, prevClose:null, source:null, asOfText:null, error:null},
  ihsgManualPrevClose:null, // kalau diisi user, prev close dikunci ke nilai ini; harga sekarang tetap otomatis
};
let autoSaveTimer=null;
let ihsgAutoTimer=null;

/* ============================== IHSG (indeks) ============================== */
async function refreshIhsg(){
  const btn = document.getElementById("ihsgRefreshBtn");
  if(btn){ btn.disabled = true; btn.classList.add("spinning"); }
  try{
    const q = await fetchYahooQuote("^JKSE");
    const effectivePrevClose = (state.ihsgManualPrevClose!==null) ? state.ihsgManualPrevClose : q.prevClose;
    const changePoint = (effectivePrevClose!==null) ? (q.price - effectivePrevClose) : null;
    const changePercent = (effectivePrevClose!==null && effectivePrevClose!==0) ? (changePoint/effectivePrevClose)*100 : null;
    state.ihsg = {
      price:q.price, changePercent, changePoint, prevClose:effectivePrevClose,
      source: state.ihsgManualPrevClose!==null ? (q.source + "+prev manual") : q.source,
      asOfText:q.asOfText, error:null,
    };
    console.log("[IHSG] data mentah dari Yahoo:", q, "| prev close efektif:", effectivePrevClose);
  }catch(e){
    console.error(e);
    state.ihsg = {...state.ihsg, error: e.message};
  }
  renderIhsgBox();
  const btnAfter = document.getElementById("ihsgRefreshBtn");
  if(btnAfter){ btnAfter.disabled = false; btnAfter.classList.remove("spinning"); }
}
function renderIhsgBox(){
  const priceEl = document.getElementById("ihsgPrice");
  const changeEl = document.getElementById("ihsgChange");
  const detailEl = document.getElementById("ihsgDetail");
  if(!priceEl || !changeEl) return;
  if(state.ihsg.error && state.ihsg.price===null){
    priceEl.textContent = "Gagal memuat";
    priceEl.title = state.ihsg.error;
    changeEl.textContent = "";
    if(detailEl) detailEl.textContent = "";
    return;
  }
  if(state.ihsg.price===null){
    priceEl.textContent = "Memuat...";
    changeEl.textContent = "";
    if(detailEl) detailEl.textContent = "";
    return;
  }
  const up = (state.ihsg.changePercent||0) >= 0;
  priceEl.title = "";
  priceEl.textContent = fmtIDR(state.ihsg.price);
  changeEl.textContent = state.ihsg.changePercent!==null
    ? ((up?"▲ ":"▼ ") + fmtPoint(state.ihsg.changePoint) + " (" + fmtPct(state.ihsg.changePercent) + ")")
    : "";
  changeEl.style.color = up ? "var(--gain)" : "var(--loss)";
  if(detailEl){
    detailEl.textContent = "Data per: " + (state.ihsg.asOfText || "tidak diketahui") + " · Prev: " + (state.ihsg.prevClose!=null ? fmtIDR(state.ihsg.prevClose) : "-");
    detailEl.title = "Sumber data: " + (state.ihsg.source || "-");
  }
}

/* ============================== STORAGE (localStorage) ============================== */
function loadTrades(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    state.trades = raw ? JSON.parse(raw) : SAMPLE_TRADES;
  }catch(e){
    console.error("Gagal memuat data dari localStorage:", e);
    state.trades = SAMPLE_TRADES;
  }
  state.booted = true;
  render();
}

function scheduleAutoSave(){
  state.saveState = "pending"; renderSaveState();
  if(autoSaveTimer) clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(()=> doSave(), 800);
}

function doSave(){
  state.saveState = "saving"; renderSaveState();
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.trades));
    state.saveState = "saved"; renderSaveState();
    setTimeout(()=>{ if(state.saveState==="saved"){ state.saveState="idle"; renderSaveState(); } }, 1500);
  }catch(e){
    console.error("Gagal menyimpan data ke localStorage:", e);
    state.saveState = "error"; renderSaveState();
  }
}

function updateTrades(next){
  state.trades = next;
  render();
  scheduleAutoSave();
}

/* ============================== DERIVED DATA ============================== */
function getComputedTrades(){ return state.trades.map(computeTrade); }
function getSahamList(ct){ return Array.from(new Set(ct.map(t=>t.kodeSaham))).sort(); }
function getFiltered(ct){
  const f = state.filters;
  return ct.filter(t=>{
    if(f.saham!=="Semua" && t.kodeSaham!==f.saham) return false;
    if(f.status!=="Semua" && t.status!==f.status) return false;
    if(f.beliFrom && t.tanggalBeli && t.tanggalBeli < f.beliFrom) return false;
    if(f.beliTo && t.tanggalBeli && t.tanggalBeli > f.beliTo) return false;
    if(f.jualFrom && (!t.tanggalJual || t.tanggalJual < f.jualFrom)) return false;
    if(f.jualTo && (!t.tanggalJual || t.tanggalJual > f.jualTo)) return false;
    return true;
  });
}
function getSummary(filtered){
  let totalRealized=0, totalPotential=0, totalModal=0, wins=0, closedCount=0;
  const perSaham={};
  filtered.forEach(t=>{
    totalModal += t.totalHargaBeli;
    if(t.isClosed){ totalRealized += t.realizedPL; closedCount++; if(t.realizedPL>0) wins++; }
    else { totalPotential += t.potentialPL; }
    perSaham[t.kodeSaham] = (perSaham[t.kodeSaham]||0) + t.plUtama;
  });
  const entries = Object.entries(perSaham);
  const best = entries.length ? entries.reduce((a,b)=> b[1]>a[1]?b:a) : null;
  const worst = entries.length ? entries.reduce((a,b)=> b[1]<a[1]?b:a) : null;
  const winRate = closedCount ? (wins/closedCount)*100 : null;
  return {totalRealized, totalPotential, total: totalRealized+totalPotential, totalModal, best, worst, winRate, closedCount, openCount: filtered.length-closedCount, totalCount: filtered.length};
}

/* ============================== SVG CHART BUILDERS (no external libs) ============================== */
function svgBarChart(entries){
  // entries: [[kode, value], ...]
  const barW = 52, gap = 26, leftPad = 8, topPad = 18, bottomPad = 34;
  const chartH = 150;
  const W = Math.max(360, entries.length*(barW+gap)+leftPad);
  const H = topPad+chartH+bottomPad;
  if(entries.length===0){
    return `<div style="height:200px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;">Belum ada data untuk ditampilkan.</div>`;
  }
  const maxPos = Math.max(0, ...entries.map(e=>e[1]));
  const maxNeg = Math.max(0, ...entries.map(e=>-e[1]));
  const range = (maxPos+maxNeg) || 1;
  const valueToY = (v) => topPad + ((maxPos - v)/range)*chartH;
  const baseY = valueToY(0);

  let bars = "";
  entries.forEach((e,i)=>{
    const [kode, val] = e;
    const x = leftPad + i*(barW+gap);
    const y = Math.min(valueToY(val), baseY);
    const h = Math.max(1, Math.abs(valueToY(val)-baseY));
    const color = val>=0 ? C_GAIN : C_LOSS;
    const labelY = val>=0 ? y-6 : y+h+14;
    bars += `
      <rect x="${x}" y="${y}" width="${barW}" height="${h}" rx="4" fill="${color}"></rect>
      <text x="${x+barW/2}" y="${labelY}" text-anchor="middle" font-size="10" fill="${color}" font-family="IBM Plex Mono, monospace">${fmtShort(val)}</text>
      <text x="${x+barW/2}" y="${topPad+chartH+18}" text-anchor="middle" font-size="11" fill="${C_MUTED}" font-family="Inter, sans-serif" font-weight="600">${esc(kode)}</text>
    `;
  });

  return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;">
    <line x1="0" y1="${baseY}" x2="${W}" y2="${baseY}" stroke="${C_BORDER}" stroke-width="1"></line>
    ${bars}
  </svg></div>`;
}

function svgDonutChart(win, lose){
  const total = win+lose;
  const r = 62, cx=90, cy=90, sw=22;
  const circumference = 2*Math.PI*r;
  if(total===0){
    return `<div style="height:200px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;">Belum ada posisi yang ditutup.</div>`;
  }
  const winFrac = win/total;
  const winLen = circumference*winFrac;
  const winRatePct = (winFrac*100).toFixed(0);
  return `<div style="display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:center;">
    <svg viewBox="0 0 180 180" width="180" height="180">
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C_LOSS}" stroke-width="${sw}"></circle>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${C_GAIN}" stroke-width="${sw}"
        stroke-dasharray="${winLen} ${circumference-winLen}" stroke-dashoffset="0"
        transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round"></circle>
      <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="24" font-weight="700" fill="${'#1E293B'}" font-family="IBM Plex Mono, monospace">${winRatePct}%</text>
      <text x="${cx}" y="${cy+16}" text-anchor="middle" font-size="10.5" fill="${C_MUTED}" font-family="Inter, sans-serif">win rate</text>
    </svg>
    <div style="font-size:12.5px; display:flex; flex-direction:column; gap:8px;">
      <div><span class="legend-dot" style="background:${C_GAIN};"></span>Profit &middot; ${win} transaksi</div>
      <div><span class="legend-dot" style="background:${C_LOSS};"></span>Rugi &middot; ${lose} transaksi</div>
    </div>
  </div>`;
}

function svgAreaChart(labels, data){
  if(data.length===0){
    return `<div style="height:200px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px;">Belum ada transaksi closed untuk membentuk kurva.</div>`;
  }
  const leftPad=44, rightPad=16, topPad=16, bottomPad=32;
  const chartW = Math.max(500, data.length*70);
  const chartH = 160;
  const W = leftPad+chartW+rightPad, H = topPad+chartH+bottomPad;

  const minV = Math.min(0, ...data), maxV = Math.max(0, ...data);
  const range = (maxV-minV) || 1;
  const valueToY = (v) => topPad + chartH - ((v-minV)/range)*chartH;
  const zeroY = valueToY(0);
  const xStep = data.length>1 ? chartW/(data.length-1) : 0;
  const xOf = (i) => leftPad + i*xStep;

  const points = data.map((v,i)=>[xOf(i), valueToY(v)]);
  const linePath = "M " + points.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L ");
  const areaPath = `M ${xOf(0).toFixed(1)},${zeroY.toFixed(1)} L ` + points.map(p=>p[0].toFixed(1)+","+p[1].toFixed(1)).join(" L ") + ` L ${xOf(data.length-1).toFixed(1)},${zeroY.toFixed(1)} Z`;

  const labelEvery = Math.ceil(data.length/10) || 1;
  let labelsSvg = "";
  labels.forEach((l,i)=>{
    if(i%labelEvery===0 || i===data.length-1){
      labelsSvg += `<text x="${xOf(i).toFixed(1)}" y="${topPad+chartH+20}" text-anchor="middle" font-size="10" fill="${C_MUTED}" font-family="Inter, sans-serif">${esc(l)}</text>`;
    }
  });

  const dots = points.map((p,i)=> `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3" fill="${C_GOLD}"></circle>`).join("");
  const lastVal = data[data.length-1];

  return `<div class="chart-box"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="max-width:100%;">
    <defs>
      <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${C_GOLD}" stop-opacity="0.35"></stop>
        <stop offset="100%" stop-color="${C_GOLD}" stop-opacity="0"></stop>
      </linearGradient>
    </defs>
    <line x1="${leftPad}" y1="${zeroY.toFixed(1)}" x2="${leftPad+chartW}" y2="${zeroY.toFixed(1)}" stroke="${C_BORDER}" stroke-width="1"></line>
    <path d="${areaPath}" fill="url(#areaGrad)" stroke="none"></path>
    <path d="${linePath}" fill="none" stroke="${C_GOLD}" stroke-width="2.5"></path>
    ${dots}
    ${labelsSvg}
    <text x="${leftPad}" y="${topPad-2}" font-size="11" fill="${lastVal>=0?C_GAIN:C_LOSS}" font-family="IBM Plex Mono, monospace" font-weight="600">Kumulatif: ${fmtIDR(lastVal)}</text>
  </svg></div>`;
}

function setupStickyHScrollbar(){
  const wrap = document.getElementById("riwayatTableWrap");
  const bar = document.getElementById("stickyHScrollBar");
  const inner = document.getElementById("stickyHScrollBarInner");
  const footerEl = document.querySelector("footer");
  if(!wrap || !bar || !inner) return;

  function update(){
    const footerH = footerEl ? footerEl.offsetHeight : 0;
    bar.style.bottom = footerH + "px";
    inner.style.width = wrap.scrollWidth + "px";
    const needsScroll = wrap.scrollWidth > wrap.clientWidth + 2;
    bar.classList.toggle("hidden", !needsScroll);
    bar.scrollLeft = wrap.scrollLeft;
  }
  update();

  if(window._stickyHScrollResizeHandler){
    window.removeEventListener("resize", window._stickyHScrollResizeHandler);
  }
  window._stickyHScrollResizeHandler = update;
  window.addEventListener("resize", update);

  let syncing = false;
  wrap.onscroll = ()=>{
    if(syncing) return;
    syncing = true;
    bar.scrollLeft = wrap.scrollLeft;
    syncing = false;
  };
  bar.onscroll = ()=>{
    if(syncing) return;
    syncing = true;
    wrap.scrollLeft = bar.scrollLeft;
    syncing = false;
  };
}

  });

  document.querySelectorAll(".dailyBadge").forEach(badge=>{
    badge.onclick = ()=>{
      const id = badge.dataset.id;
      const form = document.querySelector(`.dailyManualForm[data-id="${id}"]`);
      if(form) form.classList.toggle("hidden");
    };
  });
  document.querySelectorAll(".dailyManualApply").forEach(btn=>{

      const id = btn.dataset.id;

      render();
      scheduleAutoSave();
      showToast("Harga penutupan kemarin dikoreksi manual.");
    };
  });

  document.querySelectorAll(".refreshPriceBtn").forEach(btn=>{
    btn.onclick = async ()=>{
      const id = btn.dataset.id;
      const t = state.trades.find(x=>x.id===id);
      if(!t) return;
      const originalHTML = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = "&#8987;";
      try{
        const q = await fetchYahooPrice(t.kodeSaham);
        state.trades = state.trades.map(x=> x.id===id
          ? {...x, hargaSekarang: q.price, prevCloseHarian: (x.prevCloseHarian!==undefined && x.prevCloseHarian!==null && x.prevCloseHarian!=="") ? x.prevCloseHarian : q.prevClose}
          : x);
        render();
        scheduleAutoSave();
        showToast(`Harga ${t.kodeSaham.toUpperCase()} diperbarui: ${fmtIDR(q.price)}`);
      }catch(e){
        console.error(e);
        showToast(`Gagal ambil harga ${t.kodeSaham.toUpperCase()}: ${e.message}`);
        btn.disabled = false; btn.innerHTML = originalHTML;
      }
    };
  });

  const refreshAllBtn = document.getElementById("refreshAllBtn");
  if(refreshAllBtn){
    refreshAllBtn.onclick = async ()=>{
      const openTrades = state.trades.filter(t=> computeTrade(t).status==="Open");
      if(openTrades.length===0){ showToast("Tidak ada posisi open untuk diperbarui."); return; }
      refreshAllBtn.disabled = true;
      const statusEl = document.getElementById("refreshStatus");
      let success=0, fail=0;
      for(let i=0;i<openTrades.length;i++){
        const t = openTrades[i];
        if(statusEl) statusEl.textContent = `Memperbarui ${i+1}/${openTrades.length} (${t.kodeSaham})...`;
        try{
          const q = await fetchYahooPrice(t.kodeSaham);
          state.trades = state.trades.map(x=> x.id===t.id
            ? {...x, hargaSekarang: q.price, prevCloseHarian: (x.prevCloseHarian!==undefined && x.prevCloseHarian!==null && x.prevCloseHarian!=="") ? x.prevCloseHarian : q.prevClose}
            : x);
          success++;
        }catch(e){
          console.error(e);
          fail++;
        }
        await new Promise(r=>setTimeout(r,350));
      }
      render();
      scheduleAutoSave();
      showToast(`Refresh selesai: ${success} berhasil, ${fail} gagal.`);
    };
  }
}

/* ============================== JADWAL HARIAN: update Prev Close jam 09.00 waktu komputer ============================== */
const IHSG_DAILY_UPDATE_KEY = "ihsg_prevclose_last_auto_update";
const IHSG_CLOSING_SNAPSHOT_DATE_KEY = "ihsg_closing_snapshot_last_date";
const IHSG_CLOSING_SNAPSHOT_PRICE_KEY = "ihsg_closing_snapshot_price";
function todayLocalDateStr(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

// TAHAP 1 (jam >=16:00): simpan harga IHSG saat ini sebagai snapshot penutupan HARI INI.
async function runIhsgClosingSnapshotNow(showMsg){
  try{
    const q = await fetchYahooQuote("^JKSE");
    try{
      localStorage.setItem(IHSG_CLOSING_SNAPSHOT_PRICE_KEY, String(q.price));
      localStorage.setItem(IHSG_CLOSING_SNAPSHOT_DATE_KEY, todayLocalDateStr());
    }catch(e){}
    console.log(`[Snapshot Penutupan IHSG 16:00] harga=${q.price} jam=${new Date().toLocaleTimeString("id-ID")}`);
    if(showMsg) showToast(`Snapshot penutupan IHSG hari ini disimpan: ${fmtIDR(q.price)}`);
  }catch(e){
    console.error(e);
    if(showMsg) showToast("Gagal mengambil harga IHSG untuk snapshot penutupan.");
  }
}
function maybeRunIhsgClosingSnapshot(){
  if(!state.booted) return;
  const now = new Date();
  if(now.getHours() < 16) return; // belum jam 16:00 waktu komputer
  const today = todayLocalDateStr();
  let lastRun = null;
  try{ lastRun = localStorage.getItem(IHSG_CLOSING_SNAPSHOT_DATE_KEY); }catch(e){}
  if(lastRun === today) return;
  runIhsgClosingSnapshotNow(false);
}

// TAHAP 2 (jam >=09:00): promosikan snapshot penutupan IHSG terakhir jadi "Prev Close" hari ini.
async function maybeRunDailyIhsgUpdate(){
  const now = new Date();
  if(now.getHours() < 9) return; // belum jam 09.00 waktu komputer
  const today = todayLocalDateStr();
  let lastRun = null;
  try{ lastRun = localStorage.getItem(IHSG_DAILY_UPDATE_KEY); }catch(e){}
  if(lastRun === today) return; // sudah dijalankan hari ini
  await promoteIhsgPrevCloseNow(false);
  try{ localStorage.setItem(IHSG_DAILY_UPDATE_KEY, today); }catch(e){}
}

// Sumber utama Prev Close IHSG: "Penutupan Sebelumnya" dari id.investing.com/indices/idx-composite.
// Cadangan kalau investing.com gagal diakses: snapshot Yahoo jam 16:00 (kalau ada).
// Sumber utama Prev Close IHSG: API JSON resmi Yahoo Finance (bukan halaman web yang dijaga
// proteksi anti-bot ketat) — lebih aman & stabil dipanggil lewat proxy publik dari browser.
// Cadangan kalau Yahoo gagal diakses: snapshot Yahoo jam 16:00 kemarin (kalau ada tersimpan).
async function promoteIhsgPrevCloseNow(showMsg){
  try{
    const q = await fetchYahooQuote("^JKSE");
    if(q.prevClose===null || q.prevClose===undefined) throw new Error("prevClose kosong dari Yahoo.");
    state.ihsgManualPrevClose = q.prevClose;
    await refreshIhsg();
    showToast(`Prev Close IHSG diperbarui dari Yahoo Finance: ${fmtIDR(q.prevClose)}`);
    return;
  }catch(e){
    console.error("[IHSG Prev Close] Yahoo Finance gagal:", e.message);
  }
  // Cadangan: snapshot Yahoo jam 16:00 kemarin, kalau ada
  let snapshotPrice = null;
  try{ snapshotPrice = localStorage.getItem(IHSG_CLOSING_SNAPSHOT_PRICE_KEY); }catch(e){}
  state.ihsgManualPrevClose = snapshotPrice ? Number(snapshotPrice) : null;
  await refreshIhsg();
  if(snapshotPrice){
    showToast(`Yahoo Finance tidak bisa diakses — Prev Close IHSG dipakai dari snapshot cadangan: ${fmtIDR(Number(snapshotPrice))}`);
  } else {
    showToast("Gagal mengambil Prev Close IHSG otomatis. Isi manual lewat &#9998; sebagai cadangan.");
  }
}

/* Mekanisme 2 tahap untuk "Harga Penutupan Kemarin" per saham:                                    */
/* 1) Jam >=16:00: nilai "Harga Sekarang" saat itu diambil sebagai SNAPSHOT penutupan hari ini.     */
/* 2) Jam >=09:00 keesokan harinya: snapshot penutupan terakhir itu dipromosikan jadi "Prev Close". */
const SAHAM_CLOSING_SNAPSHOT_KEY = "saham_closing_snapshot_last_date";
const SAHAM_DAILY_UPDATE_KEY = "saham_prevclose_last_auto_update";

function renderPrevCloseLastRunStatus(){
  const snapEl = document.getElementById("closingSnapshotLastRun");
  const promoteEl = document.getElementById("prevCloseLastRun");
  if(!snapEl || !promoteEl) return;
  let lastPromote = null, lastSnapshot = null;
  try{
    lastPromote = localStorage.getItem(SAHAM_DAILY_UPDATE_KEY);
    lastSnapshot = localStorage.getItem(SAHAM_CLOSING_SNAPSHOT_KEY);
  }catch(e){}
  snapEl.textContent = lastSnapshot ? `terakhir: ${fmtDateDMY(lastSnapshot)}` : "belum pernah";
  promoteEl.textContent = lastPromote ? `terakhir: ${fmtDateDMY(lastPromote)}` : "belum pernah";
}

// TAHAP 1 (jam >=16:00): simpan "Harga Sekarang" saat ini sebagai snapshot penutupan HARI INI.
function runClosingSnapshotNow(showMsg){
  let count = 0, skipped = 0;
  const today = todayLocalDateStr();
  const updated = state.trades.map(t=>{
    const c = computeTrade(t);
    if(c.isClosed) return t;
    const hs = t.hargaSekarang;
    if(hs===undefined || hs===null || hs===""){ skipped++; return t; }
    count++;
    return {...t, lastClosingPrice: hs, lastClosingDate: today};
  });
  state.trades = updated;
  try{ localStorage.setItem(SAHAM_CLOSING_SNAPSHOT_KEY, today); }catch(e){}
  render();
  scheduleAutoSave();
  console.log(`[Snapshot Penutupan 16:00] ${count} disimpan, ${skipped} dilewati. Jam: ${new Date().toLocaleTimeString("id-ID")}`);
  if(showMsg) showToast(`Snapshot penutupan hari ini disimpan untuk ${count} saham${skipped>0?` (${skipped} dilewati krn "Harga Sekarang" kosong)`:""}.`);
}
function maybeRunClosingSnapshot(){
  if(!state.booted) return;
  const now = new Date();
  if(now.getHours() < 16) return; // belum jam 16:00 waktu komputer
  const today = todayLocalDateStr();
  let lastRun = null;
  try{ lastRun = localStorage.getItem(SAHAM_CLOSING_SNAPSHOT_KEY); }catch(e){}
  if(lastRun === today) return;
  runClosingSnapshotNow(false);
}

// TAHAP 2 (jam >=09:00): promosikan snapshot penutupan terakhir jadi "Prev Close" hari ini.
function runSahamPrevCloseUpdateNow(forceIgnoreDailyLock){
  let count = 0, skipped = 0;
  const updated = state.trades.map(t=>{
    const c = computeTrade(t);
    if(c.isClosed) return t; // posisi closed tidak relevan
    const closePrice = t.lastClosingPrice;
    if(closePrice===undefined || closePrice===null || closePrice===""){ skipped++; return t; } // belum ada snapshot penutupan
    count++;
    return {...t, prevCloseHarian: closePrice};
  });
  state.trades = updated;
  try{ localStorage.setItem(SAHAM_DAILY_UPDATE_KEY, todayLocalDateStr()); }catch(e){}
  render();
  scheduleAutoSave();
  console.log(`[Update Prev Close 09:00] ${count} diperbarui, ${skipped} dilewati (belum ada snapshot penutupan). Jam: ${new Date().toLocaleTimeString("id-ID")}`);
  if(count>0){
    showToast(`Prev Close ${count} saham diperbarui dari snapshot penutupan terakhir${skipped>0 ? ` (${skipped} dilewati krn belum ada snapshot 16:00)` : ""}.`);
  } else {
    showToast(`Belum ada snapshot penutupan tersimpan. Klik "Simpan Snapshot Penutupan" dulu (atau tunggu jam 16:00 otomatis).`);
  }
}
function maybeRunDailySahamPrevCloseUpdate(){
  if(!state.booted) return; // trades belum termuat
  const now = new Date();
  if(now.getHours() < 9) return; // belum jam 09.00 waktu komputer
  const today = todayLocalDateStr();
  let lastRun = null;
  try{ lastRun = localStorage.getItem(SAHAM_DAILY_UPDATE_KEY); }catch(e){}
  if(lastRun === today) return; // sudah dijalankan hari ini
  runSahamPrevCloseUpdateNow();
}

refreshIhsg();
maybeRunIhsgClosingSnapshot();
maybeRunDailyIhsgUpdate();
setInterval(()=>{ maybeRunIhsgClosingSnapshot(); maybeRunDailyIhsgUpdate(); }, 60*1000); // cek tiap menit: snapshot IHSG jam 16:00, promosi Prev Close jam 09:00
loadTrades();
maybeRunClosingSnapshot();
maybeRunDailySahamPrevCloseUpdate();
setInterval(()=>{ maybeRunClosingSnapshot(); maybeRunDailySahamPrevCloseUpdate(); }, 60*1000); // cek tiap menit: snapshot jam 16:00, promosi jam 09:00
if(ihsgAutoTimer) clearInterval(ihsgAutoTimer);
ihsgAutoTimer = setInterval(refreshIhsg, 5*60*1000);
</script>
